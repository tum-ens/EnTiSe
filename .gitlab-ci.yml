# GitLab CI/CD configuration for EnTiSe Python package
# Using uv for faster dependency management

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  GIT_DEPTH: "0"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(develop|main)$/'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^(develop|main)$/'

stages:
  - verify

cache:
  key: "$CI_JOB_NAME_SLUG"
  paths:
    - .pip-cache/
    - .uv-cache/

.python-job-template: &python-job-template
  stage: verify
  before_script:
    - python -m pip install uv
    - uv venv --python python
    - export PATH="$CI_PROJECT_DIR/.venv/bin:$PATH"
    - uv pip install -e ".[dev]"

lint:
  <<: *python-job-template
  image: python:3.12
  allow_failure: true
  script:
    - |
      status=0
      ruff check . || status=1
      ruff format --check . || status=1
      mypy entise || status=1
      exit "$status"

.test:
  <<: *python-job-template
  script:
    # Each job pins one pandas line on top of the normal install.
    - uv pip install "$PANDAS_SPEC"
    - python -c "import pandas; print('pandas', pandas.__version__)"
    - pytest -m "not native_pylpg" --cov=entise --cov-report=xml tests/ --junitxml=junit/test-report.xml
  artifacts:
    reports:
      junit: junit/test-report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test:develop:
  extends: .test
  image: python:3.12
  parallel:
    matrix:
      - PANDAS_SPEC: ["pandas>=2.3,<3", "pandas>=3,<4"]
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" || $CI_COMMIT_BRANCH == "develop"'

test:main:
  extends: .test
  image: python:$PYTHON_VERSION
  parallel:
    matrix:
      # The oldest supported Python tests the oldest supported pandas.
      - PYTHON_VERSION: "3.11"
        PANDAS_SPEC: "pandas==2.2.2"
      - PYTHON_VERSION: "3.12"
        PANDAS_SPEC: "pandas>=2.3,<3"
      - PYTHON_VERSION: ["3.11", "3.12", "3.13", "3.14"]
        PANDAS_SPEC: "pandas>=3,<4"
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_COMMIT_BRANCH == "main"'

test:native-pylpg:
  <<: *python-job-template
  image: python:3.12
  allow_failure: true
  script:
    - pytest -m native_pylpg tests/ --junitxml=junit/native-pylpg.xml
  artifacts:
    reports:
      junit: junit/native-pylpg.xml
