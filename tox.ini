[tox]
envlist = py311, py312, py313, py314
isolated_build = True

# The test envs match the CI test jobs: native pyLPG tests run in their own env,
# as in the test:native-pylpg job.
[testenv]
deps =
    uv
commands =
    uv pip install -e ".[dev]"
    pytest -m "not native_pylpg" {posargs:tests}

[testenv:native-pylpg]
deps =
    uv
commands =
    uv pip install -e ".[dev]"
    pytest -m native_pylpg {posargs:tests}

# The same checks as the CI lint job.
[testenv:lint]
deps =
    uv
commands =
    uv pip install -e ".[dev]"
    ruff check .
    ruff format --check .
    mypy entise
