[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "entise"
dynamic = ["version"]
description = "A tool for generating time series data related to energy systems and building operations"
readme = "README.rst"
authors = [
    {name = "Markus Doepfert", email = "markus.doepfert@tum.de"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
keywords = ["energy", "time series", "simulation"]
dependencies = [
    "joblib>=1.0.0",
    "numpy>=2.0.0",
    "pandas>=2.2.2,<4",
    "tqdm>=4.0.0",
]
requires-python = ">=3.10,<3.14"

[project.optional-dependencies]
dhw-jordanvajen = ["holidays>=0.50", "scipy"]
electricity-demandlib = ["demandlib", "holidays>=0.50"]
electricity-pylpg = ["pyloadprofilegenerator"]
file = []
heating-demandlib = ["demandlib", "holidays>=0.50"]
hp-ruhnau = []
hvac-1r0c = ["pvlib>=0.12.0"]
hvac-1r1c = ["pvlib>=0.12.0"]
hvac-5r1c = ["pvlib>=0.12.0"]
hvac-7r2c = ["pvlib>=0.12.0"]
occupancy-geoma = []
occupancy-pht = []
pv-pvlib = ["pvlib>=0.12.0"]
wind-wplib = ["windpowerlib"]

cooling = ["entise[file]"]
dhw = ["entise[dhw-jordanvajen,file]"]
electricity = ["entise[electricity-demandlib,electricity-pylpg,file]"]
heating = ["entise[heating-demandlib,file]"]
hp = ["entise[hp-ruhnau,file]"]
hvac = ["entise[hvac-1r0c,hvac-1r1c,hvac-5r1c,hvac-7r2c,file]"]
mobility = ["entise[file]"]
occupancy = ["entise[occupancy-geoma,occupancy-pht,file]"]
pv = ["entise[pv-pvlib,file]"]
wind = ["entise[wind-wplib,file]"]
all = ["entise[cooling,dhw,electricity,examples,heating,hp,hvac,mobility,occupancy,pv,weather,wind]"]

examples = ["matplotlib>=3.9", "notebook>=7.5.4"]
weather = ["openmeteo-requests", "pint", "pvlib>=0.12.0", "requests-cache", "retry-requests"]
dev = [
    "entise[dhw,electricity,heating,hp,hvac,occupancy,pv,weather,wind]",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.11.12",
    "mypy>=1.16.0",
    "pre-commit>=4.2.0",
    "tox>=4.0.0",
    "uv>=0.7.8",
]
docs = [
    "myst-nb",
    "sphinx",
    "sphinxcontrib-mermaid",
    "sphinx-rtd-theme",
]
numba = [
    "numba>=0.59",
]
# Commented out for PyPI compatibility - install manually if needed
# districtheatingsim = [
#     "districtheatingsim @ git+https://github.com/JonasPfeiffer123/DistrictHeatingSim.git ; python_version >= '3.11' and python_version < '3.12'",
# ]

[project.urls]
"Homepage" = "https://gitlab.lrz.de/tum-ens/need/entise"
"Bug Tracker" = "https://gitlab.lrz.de/tum-ens/need/entise/-/issues"
"Documentation" = "https://entise.readthedocs.io"

[tool.setuptools]
packages = ["entise"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
# Only include essential files for source distribution
include = [
    "/entise",
    "/README.rst",
    "/LICENSE*",
    "/CHANGELOG*",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["entise"]

[tool.ruff]
lint.select = ["E", "F", "B", "I"]
lint.ignore = []
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
markers = [
    "native_pylpg: runs the external PyLPG engine",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["entise"]
